name: Bajar datos de prueba

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar partidos dia por dia
        run: |
          mkdir -p data/dias
          B="https://site.api.espn.com/apis/site/v2/sports/basketball/nba"
          : > data/resumen.txt
          for i in $(seq 0 13); do
            d=$(date -u -d "2026-10-20 +$i day" +%Y%m%d)
            code=$(curl -sS --compressed -A "Mozilla/5.0" -o "data/dias/$d.json" -w "%{http_code}" "$B/scoreboard?dates=$d" || echo "000")
            [ "$code" != "200" ] && echo "$d -> HTTP $code" | tee -a data/resumen.txt
          done
          ls data/dias | wc -l | xargs echo "Archivos de dias:" | tee -a data/resumen.txt

      - name: Armar resumen
        run: |
          python3 - <<'PY' >> data/resumen.txt
          import json, glob
          from datetime import datetime, timedelta
          for f in sorted(glob.glob('data/dias/*.json')):
              try:
                  d = json.load(open(f))
              except Exception as x:
                  print(f, 'ERROR', x)
                  continue
              for e in d.get('events', []):
                  c = e['competitions'][0]
                  t = datetime.fromisoformat(e['date'].replace('Z', '+00:00')) - timedelta(hours=3)
                  cs = c['competitors']
                  away = [x['team']['abbreviation'] for x in cs if x.get('homeAway') == 'away']
                  home = [x['team']['abbreviation'] for x in cs if x.get('homeAway') == 'home']
                  can = [n for b in c.get('broadcasts', []) for n in b.get('names', [])]
                  print(t.strftime('%d/%m %H:%M'), away, '@', home, can)
          PY
          cat data/resumen.txt

      - name: Guardar en el repositorio
        run: |
          git config user.name "robot-agenda"
          git config user.email "robot-agenda@users.noreply.github.com"
          git add data
          git commit -m "Datos de prueba 3" || echo "Sin cambios"
          git push
